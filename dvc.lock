      params.yaml:
        evaluation.cost_false_negative: 10.0
        evaluation.cost_false_positive: 1.0
        evaluation.risk_band_medium_ratio: 0.5
        mlflow:
          tracking_uri: sqlite:///mlflow/mlflow.db
          experiment_name: ev-battery-failure-prediction
          registered_model_name: ev-battery-failure-model
        target_column: battery_failure
        train:
          random_state: 42
          selection_metric: cv_pr_auc
          cv_folds: 5
          candidates:
            logistic_regression:
              C: 0.5
              class_weight: balanced
              max_iter: 2000
            random_forest:
              n_estimators: 400
              max_depth: 12
              min_samples_leaf: 3
              class_weight: balanced
            lightgbm:
              n_estimators: 500
              learning_rate: 0.03
              num_leaves: 31
              min_child_samples: 20
              subsample: 0.8
              subsample_freq: 1
              colsample_bytree: 0.8
            xgboost:
              n_estimators: 500
              learning_rate: 0.03
              max_depth: 6
              subsample: 0.8
              colsample_bytree: 0.8
          tuning:
            enabled: true
            model: lightgbm
            n_trials: 25
