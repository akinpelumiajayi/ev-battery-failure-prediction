# OPTIONAL: Argo Rollouts canary — a drop-in replacement for the Helm chart's
# Deployment once the Argo Rollouts controller is installed in-cluster.
#
# Shifts traffic to a new model version in steps and runs a Prometheus
# analysis between them: if p95 latency or the error rate regresses, the
# rollout aborts and traffic snaps back to the stable version automatically.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ev-battery-api
  namespace: mlops-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ev-battery-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ev-battery-api
    spec:
      containers:
        - name: api
          # pinned to an immutable git-SHA tag by the promotion PR
          image: ghcr.io/akinpelumiajayi/ev-battery-failure-prediction:latest
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
  strategy:
    canary:
      steps:
        - setWeight: 10
        - pause: { duration: 5m }
        - analysis:
            templates:
              - templateName: model-serving-health
        - setWeight: 50
        - pause: { duration: 10m }
        - analysis:
            templates:
              - templateName: model-serving-health
        - setWeight: 100
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: model-serving-health
  namespace: mlops-prod
spec:
  metrics:
    - name: p95-latency
      interval: 1m
      count: 5
      successCondition: result[0] < 0.25
      failureLimit: 2
      provider:
        prometheus:
          address: http://prometheus-operated.monitoring.svc:9090
          query: |
            histogram_quantile(0.95, sum(rate(prediction_latency_seconds_bucket{namespace="mlops-prod"}[5m])) by (le))
    - name: error-rate
      interval: 1m
      count: 5
      successCondition: result[0] < 0.01
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus-operated.monitoring.svc:9090
          query: |
            sum(rate(prediction_errors_total{namespace="mlops-prod"}[5m]))
            / clamp_min(sum(rate(predictions_total{namespace="mlops-prod"}[5m])), 1e-9)
