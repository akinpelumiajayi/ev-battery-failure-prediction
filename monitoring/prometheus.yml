global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  # Docker Compose target. In Kubernetes the Helm chart ships a
  # ServiceMonitor instead (helm/ev-battery-model/templates/servicemonitor.yaml),
  # picked up by the Prometheus Operator.
  - job_name: ev-battery-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
