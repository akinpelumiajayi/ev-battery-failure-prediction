global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "ev-battery-api"
    metrics_path: /metrics
    static_configs:
      # Docker Compose service name — in Kubernetes this becomes a
      # ServiceMonitor (see k8s/base/servicemonitor.yaml) instead.
      - targets: ["api:8000"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

rule_files:
  - "alert_rules.yml"
