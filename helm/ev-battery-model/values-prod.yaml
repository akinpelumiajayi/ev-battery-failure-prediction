# Production overrides. `image.tag` is only ever changed through a reviewed
# pull request opened by .github/workflows/promote-prod.yml, and ArgoCD
# syncs prod manually — two human gates before customer-facing traffic.
replicaCount: 3

image:
  tag: "latest"   # replaced with an immutable git-SHA tag by the promotion PR

autoscaling:
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 60

podDisruptionBudget:
  minAvailable: 2

httpRoute:
  enabled: true
  hostnames:
    - ev-battery.example.com     # replace with your domain
  parentRefs:
    - name: public               # the cluster's shared Gateway
      namespace: gateway-system

serviceMonitor:
  enabled: true

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 1Gi
