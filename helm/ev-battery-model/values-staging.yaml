# Staging overrides. CI (.github/workflows/cd.yml) rewrites `image.tag` to
# the git SHA of every green build on main; ArgoCD auto-syncs that commit.
replicaCount: 1

image:
  tag: "22f8aa80fac95ff7a613078a1ed15fa56402a177"

autoscaling:
  minReplicas: 1
  maxReplicas: 3

podDisruptionBudget:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
