# Staging overrides. CI (.github/workflows/cd.yml) rewrites `image.tag` to
# the git SHA of every green build on main; ArgoCD auto-syncs that commit.
replicaCount: 1

image:
  tag: "3b985cd7a6655e78204f17331f2c0a4fd756d92d"

autoscaling:
  minReplicas: 1
  maxReplicas: 3

podDisruptionBudget:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
