# Staging overrides. CI (.github/workflows/cd.yml) rewrites `image.tag` to
# the git SHA of every green build on main; ArgoCD auto-syncs that commit.
replicaCount: 1

image:
  tag: "4ce4a65333415b359d0f58f580ff352a25d31858"

autoscaling:
  minReplicas: 1
  maxReplicas: 3

podDisruptionBudget:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
