# Staging overrides. CI (.github/workflows/cd.yml) rewrites `image.tag` to
# the git SHA of every green build on main; ArgoCD auto-syncs that commit.
replicaCount: 1

image:
  tag: "52ced12fd6da41a36c457e5b7cd16a28e622a10e"

autoscaling:
  minReplicas: 1
  maxReplicas: 3

podDisruptionBudget:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
