{{- if .Values.httpRoute.enabled }}
# External exposure through the Kubernetes Gateway API (the successor to
# Ingress). The Gateway itself is shared platform infrastructure; this chart
# only attaches a route to it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "ev-battery.fullname" . }}
  labels:
    {{- include "ev-battery.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: {{ include "ev-battery.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
