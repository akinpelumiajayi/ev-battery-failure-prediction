apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ev-battery-api
  labels:
    app: {{ .Release.Name }}-ev-battery-api
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-ev-battery-api
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-ev-battery-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
        checksum/config: {{ .Values.modelVersion | quote }}
    spec:
      containers:
        - name: ev-battery-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ add .Values.probes.initialDelaySeconds 10 }}
            periodSeconds: {{ add .Values.probes.periodSeconds 10 }}
          env:
            - name: MODEL_VERSION
              value: {{ .Values.modelVersion | quote }}
