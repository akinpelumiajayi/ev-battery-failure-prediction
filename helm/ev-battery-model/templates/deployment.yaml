apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ev-battery.fullname" . }}
  labels:
    {{- include "ev-battery.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0   # never drop below capacity during a model rollout
  selector:
    matchLabels:
      {{- include "ev-battery.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ev-battery.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: {{ .Values.service.targetPort | quote }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: MODEL_VERSION
              value: {{ .Values.image.tag | trunc 12 | quote }}
            {{- if .Values.inferenceLog.enabled }}
            - name: INFERENCE_LOG_URI
              value: {{ required "inferenceLog.uri is required when inferenceLog.enabled" .Values.inferenceLog.uri | quote }}
            - name: INFERENCE_LOG_SAMPLE_RATE
              value: {{ .Values.inferenceLog.sampleRate | quote }}
            - name: INFERENCE_LOG_FLUSH_SECONDS
              value: {{ .Values.inferenceLog.flushSeconds | quote }}
          {{- with .Values.inferenceLog.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet: { path: {{ .Values.probes.path }}, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: {{ .Values.probes.path }}, port: http }
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
          livenessProbe:
            httpGet: { path: {{ .Values.probes.path }}, port: http }
            periodSeconds: {{ mul .Values.probes.periodSeconds 2 }}
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
