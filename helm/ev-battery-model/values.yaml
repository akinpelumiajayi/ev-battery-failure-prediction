# Base values shared by every environment. values-staging.yaml and
# values-prod.yaml override only what differs.

image:
  repository: ghcr.io/akinpelumiajayi/ev-battery-failure-prediction
  tag: latest            # always overridden per environment with an immutable git-SHA tag
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: "1"
    memory: 768Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 65

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# External exposure via a Gateway API HTTPRoute attached to a shared Gateway.
# Off by default so the chart installs on a cluster without the Gateway API.
httpRoute:
  enabled: false
  hostnames: []
  parentRefs: []        # e.g. [{name: public, namespace: gateway-system}]

probes:
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 10

# Inference log (src/serving/inference_log.py): every prediction written as
# Parquet to S3-compatible object storage, read back by the drift check.
# Credentials (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, optionally
# AWS_ENDPOINT_URL / AWS_DEFAULT_REGION) come from an existing Secret.
inferenceLog:
  enabled: false
  uri: ""                 # e.g. s3://ev-battery-inference/prod
  sampleRate: 1.0
  flushSeconds: 60
  existingSecret: ""      # name of the Secret holding the AWS_* variables

# Prometheus Operator integration (kube-prometheus-stack). Off by default so
# the chart installs on a bare cluster (e.g. kind in CI) without the CRDs.
serviceMonitor:
  enabled: false
  interval: 15s
  labels:
    release: kube-prometheus-stack

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
