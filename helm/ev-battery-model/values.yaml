# Base values shared by every environment. values-staging.yaml and
# values-prod.yaml override only what differs.

image:
  repository: ghcr.io/akinpelumiajayi/ev-battery-failure-prediction
  tag: latest            # always overridden per environment with an immutable git-SHA tag
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: "1"
    memory: 768Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 65

podDisruptionBudget:
  enabled: true
  minAvailable: 1

ingress:
  enabled: false
  className: nginx
  host: ev-battery.local

probes:
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 10

# Prometheus Operator integration (kube-prometheus-stack). Off by default so
# the chart installs on a bare cluster (e.g. kind in CI) without the CRDs.
serviceMonitor:
  enabled: false
  interval: 15s
  labels:
    release: kube-prometheus-stack

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
