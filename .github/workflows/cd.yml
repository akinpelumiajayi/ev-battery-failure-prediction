name: CD - promote to staging

# GitOps: this workflow never talks to Kubernetes. When CI is green on main
# it rewrites `image.tag` in values-staging.yaml to the new git SHA and
# commits it. ArgoCD (argocd/application-staging.yaml) watches that file and
# reconciles the cluster — Git is the single source of truth and the audit log.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: cd-staging
  cancel-in-progress: false

jobs:
  bump-staging-image:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Point staging at the new image
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          sed -i -E "s/^(  tag: ).*/\1\"${SHA}\"/" helm/ev-battery-model/values-staging.yaml
          git diff --stat
          grep -n 'tag:' helm/ev-battery-model/values-staging.yaml

      - name: Commit and push
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/ev-battery-model/values-staging.yaml
          if git diff --cached --quiet; then
            echo "Staging already at ${SHA}"; exit 0
          fi
          git commit -m "deploy(staging): ev-battery-api ${SHA::12}"
          git push
          echo "Staging now tracks \`${SHA}\` — ArgoCD will sync it." >> "$GITHUB_STEP_SUMMARY"

      # Optional: ask ArgoCD to sync now instead of waiting for its poll
      # interval. Skipped unless ARGOCD_SERVER / ARGOCD_AUTH_TOKEN are set.
      - name: Trigger ArgoCD sync
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        if: env.ARGOCD_AUTH_TOKEN != ''
        run: |
          curl -sSf -X POST "https://${ARGOCD_SERVER}/api/v1/applications/ev-battery-model-staging/sync" \
            -H "Authorization: Bearer ${ARGOCD_AUTH_TOKEN}"
