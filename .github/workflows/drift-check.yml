name: Drift check

# The monitoring loop. Compares an incoming batch with the training reference
# (PSI per feature). If drift crosses the thresholds in params.yaml it
#   1. opens (or updates) a GitHub issue with the drifted features, and
#   2. dispatches the CI workflow to retrain, evaluate and gate a new model.
#
# The schedule checks the held-out batch (expected: healthy). Run it manually
# with a simulated scenario to watch the whole loop fire end to end.

on:
  schedule:
    - cron: "0 6 * * 1"    # weekly, Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      scenario:
        description: Batch to check
        type: choice
        options: [none, heatwave, aging, new_market]
        default: heatwave
      retrain:
        description: Dispatch retraining when drift is detected
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/train.txt

      - name: Install dependencies
        run: pip install -r requirements/train.txt

      - name: Build reference + batch
        run: |
          python -m src.data.fetch_data
          python -m src.data.preprocess
          SCENARIO="${{ inputs.scenario || 'none' }}"
          if [ "$SCENARIO" = "none" ]; then
            echo "BATCH=data/processed/test.parquet" >> "$GITHUB_ENV"
          else
            python -m src.monitoring.simulate_drift --scenario "$SCENARIO"
            echo "BATCH=data/drift/$SCENARIO.parquet" >> "$GITHUB_ENV"
          fi
          echo "SCENARIO=$SCENARIO" >> "$GITHUB_ENV"

      - name: Run PSI drift check
        id: drift
        run: |
          python -m src.monitoring.drift_check --current "$BATCH"
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          r = json.load(open("artifacts/drift_report.json"))
          print(f"detected={str(r['drift_detected']).lower()}")
          print(f"n_drifted={r['n_features_drifted']}")
          EOF
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("artifacts/drift_report.json"))
          print(f"### Drift check — `{r['current_path']}`\n")
          print(f"**{'🚨 DRIFT DETECTED' if r['drift_detected'] else '✅ No significant drift'}** — "
                f"{r['n_features_drifted']}/{r['n_features_checked']} features over PSI {r['psi_threshold']} "
                f"(max PSI {r['max_psi']})\n")
          print("| Feature | PSI |\n|---|---:|")
          for f, s in list(r["all_scores"].items())[:10]:
              print(f"| {f} | {s:.3f} |")
          EOF

      - uses: actions/upload-artifact@v5
        with:
          name: drift-report
          path: artifacts/drift_report.json

      - name: Open or update drift issue
        if: steps.drift.outputs.detected == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('artifacts/drift_report.json', 'utf8'));
            const rows = Object.entries(r.drifted_features).map(([f, s]) => `| ${f} | ${s} |`).join('\n');
            const body = [
              `**Scenario:** \`${process.env.SCENARIO}\` · **batch:** \`${r.current_path}\` · ` +
              `**run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '', `${r.n_features_drifted}/${r.n_features_checked} features over PSI ${r.psi_threshold} ` +
              `(share ${(r.share_drifted * 100).toFixed(1)}%, max PSI ${r.max_psi}).`,
              '', '| Feature | PSI |', '|---|---:|', rows, '',
              'Retraining has been dispatched (CI workflow) — the new model must pass the quality and champion/challenger gates before it can ship.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'data-drift' });
            if (open.data.length) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.data[0].number, body });
            } else {
              await github.rest.issues.create({ owner, repo, labels: ['data-drift'],
                title: `Data drift detected: ${r.n_features_drifted} features over PSI threshold`, body });
            }

      - name: Dispatch retraining
        if: steps.drift.outputs.detected == 'true' && (inputs.retrain || github.event_name == 'schedule')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --ref main -f reason="drift detected (${SCENARIO}): ${{ steps.drift.outputs.n_drifted }} features"
          echo "🔁 Retraining dispatched" >> "$GITHUB_STEP_SUMMARY"
