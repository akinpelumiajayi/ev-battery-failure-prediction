name: Promote to production

# Human-in-the-loop promotion. Opens a pull request that pins
# values-prod.yaml to an image already validated in staging. Merging the PR
# (review #1) and manually syncing the prod ArgoCD app (review #2) are the
# two gates between a model and customer-facing traffic.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag (git SHA) to promote. Leave empty to promote what staging runs now.
        required: false

permissions:
  contents: write
  pull-requests: write
  packages: read

jobs:
  open-promotion-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(grep -E '^  tag:' helm/ev-battery-model/values-staging.yaml | sed -E 's/.*"?([0-9a-f]{40})"?.*/\1/')
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Promoting $TAG"

      - name: Verify the image exists in GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker manifest inspect "ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}" > /dev/null

      - name: Pin prod values
        run: sed -i -E "s/^(  tag: )\"[^\"]*\"/\1\"${{ steps.tag.outputs.tag }}\"/" helm/ev-battery-model/values-prod.yaml

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: promote/prod-${{ steps.tag.outputs.tag }}
          commit-message: "deploy(prod): ev-battery-api ${{ steps.tag.outputs.tag }}"
          title: "Promote ev-battery-api ${{ steps.tag.outputs.tag }} to production"
          body: |
            Pins `helm/ev-battery-model/values-prod.yaml` to `ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}`.

            **Checklist before merging**
            - [ ] Staging is healthy on this tag (Grafana: latency, error rate, risk-band mix)
            - [ ] Model report for this commit passed the champion/challenger gate
            - [ ] No open `data-drift` issue that this model hasn't addressed

            After merge, sync manually: `argocd app sync ev-battery-model-prod`
          labels: deployment
