apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ev-battery-api
  namespace: mlops
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: ev-battery.example.com   # replace with your real domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ev-battery-api
                port:
                  number: 80
