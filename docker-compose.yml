# Local stack — everything the cluster runs, minus Kubernetes.
#
#   make docker-up        (requires a trained model: `dvc repro` first)
#
#   Demo UI      http://localhost:8501
#   API docs     http://localhost:8000/docs
#   MLflow UI    http://localhost:5000
#   Prometheus   http://localhost:9090   (alerts: /alerts)
#   Grafana      http://localhost:3000   (anonymous viewer; admin/admin)

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.serve
    image: ev-battery-api:local
    ports: ["8000:8000"]
    environment:
      MODEL_VERSION: local-dev
    restart: unless-stopped

  demo:
    build:
      context: .
      dockerfile: docker/Dockerfile.demo
    image: ev-battery-demo:local
    ports: ["8501:8501"]
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.0
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/mlruns
    volumes:
      - ./mlflow:/mlflow
    ports: ["5000:5000"]

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports: ["9090:9090"]
    depends_on: [api]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ev-battery.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

  # Synthetic traffic so the dashboards have something to show:
  #   docker compose --profile loadgen up loadgen
  loadgen:
    profiles: ["loadgen"]
    image: python:3.12-slim
    volumes:
      - ./scripts:/scripts:ro
    command: python /scripts/load_test.py --url http://api:8000 --rps 5 --duration 600
    depends_on:
      api:
        condition: service_healthy
